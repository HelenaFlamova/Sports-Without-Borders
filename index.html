*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{margin:0;min-height:100%;background:var(--ivory);color:var(--black);font-family:'Playfair Display',Georgia,serif;font-size:17px;line-height:1.54;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:3px}button:active:not(:disabled){transform:scale(.99)}.sr{position:absolute!important;overflow:hidden;clip:rect(0,0,0,0);width:1px;height:1px;white-space:nowrap}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{line-height:1.15}p{margin-bottom:13px}.smallcaps{font:700 11px/1.35 Georgia,serif;letter-spacing:.16em;text-transform:uppercase}.shell{max-width:560px;margin:auto;min-height:100dvh;position:relative;background:var(--ivory)}.brandbar{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--black);padding:12px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:67px;padding-top:max(12px,env(safe-area-inset-top))}.brandname{display:flex;align-items:center;gap:12px;min-width:0}.brandmark{width:39px;height:39px;flex:0 0 39px;border:1.6px solid rgba(255,255,255,.78);border-radius:50%;display:grid;place-items:center;transform:rotate(-10deg);font:700 12px Georgia,serif;letter-spacing:-.04em}.brandcopy{line-height:1.13}.brandcopy strong{font-size:18px;font-weight:800;display:block;letter-spacing:-.025em}.brandcopy small{font:700 10px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;opacity:.82}.passport-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.5);padding:8px 10px;border-radius:22px;color:white;font:700 12px Georgia,serif;white-space:nowrap}.passport-chip:active{transform:none}.viewport{padding:19px 16px 94px;min-height:calc(100dvh - 70px)}.panel{backgrou padding:17px 18px;font-size:16px;margin-top:19px}.hint b{color:var(--red)}.primary{background:var(--red);color:#fff;border:2px solid var(--red);border-radius:13px;padding:15px 18px;font:700 17px Georgia,serif;min-height:57px;width:100%;display:flex;justify-content:center;align-items:center;gap:10px}.primary:hover:not(:disabled){background:var(--red-dark)}.primary.dark{background:var(--black);border-color:var(--black)}.secondary{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:13px;padding:13px 16px;font:700 16px Georgia,serif;min-height:55px;display:grid;place-items:center}.navrow{display:flex;gap:10px;align-items:center;margin-top:23px}.navrow .primary{flex:1}.navrow .secondary{flex:0 0 104px}.minihead{display:flex;justify-content:space-between;align-items:center;margin-top:6px;margin-bottom:17px;gap:9px}.progressline{height:8px;background:#e4d8d6;border-radius:22px;overflow:hidden;margin:12px 0 24px}.progressline>span{height:100%;display:block;background:var(--red);border-radius:22px;transition:width .16s}.qword{font-size:clamp(25px,6vw,31px);line-height:1.37;margin:14px 0 23px;letter-spacing:-.015em}.answers{display:grid;gap:12px}.answer{color:var(--black);background:white;border:2px solid var(--line);padding:17px 14px 17px 15px;border-radius:13px;min-height:75px;display:flex;gap:13px;align-items:center;width:100%;text-align:left;font-size:17px;line-height:1.5}.answer span.key{width:35px;height:35px;border-radius:50%;border:1px solid var(--line);background:var(--ivory);color:var(--red);font:700 14px Georgia,serif;display:grid;place-items:center;flex:0 0 35px}.answer[aria-pressed="true"]{background:#f9ebed;border-color:var(--red)}.answer[aria-pressed="true"] .key{background:var(--red);color:#fff;border-color:var(--red)}.answer:hover{border-color:var(--red)}.answer-text{flex:1}.question-instruction{font:14px/1.55 Georgia,serif;color:var(--muted);margin:16px 0 0}.feedback-hero{padding:26px 24px;background:var(--black);color:#fff;text-align:center}.feedback-hero .eyebrow{color:#ffcbd5}.feedback-hero strong{display:block;font-size:60px;line-height:1.05;margin:10px auto}.feedback-hero h2{font-size:30px;margin:12px 0}.feedback-hero p{font-size:16px;line-height:1.6;color:#f4e8e7;margin-bottom:0}.feedback-stack{display:grid;gap:13px}.feedback-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 18px}.feedback-card.is-wrong{border-left:4px solid var(--red)}.feedback-label{font:700 11px Georgia,serif;text-transform:uppercase;letter-spacing:.13em;color:var(--red);margin-bottom:10px}.feedback-card h3{font-size:19px;line-height:1.4;margin:0 0 13px}.feedback-card p{font-size:15px;line-height:1.58;margin:7px 0}.feedback-card .fact{background:var(--ivory);border-radius:10px;padding:14px;font-size:16px;line-height:1.66;margin:14px 0 0}.feedback-card .fact strong{color:var(--red)}.result-end{margin-top:23px;padding-top:17px;border-top:1px solid var(--line)}.result-end p{font-size:16px;color:var(--muted)}.finish{background:var(--black);color:#fff;border-radius:23px;padding:34px 22px;text-align:center}.seal{width:134px;height:134px;margin:5px auto 21px;border-radius:50%;border:3px double #ffccd2;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);font:700 15px Georgia,serif;letter-spacing:.11em}.finish h1{font-size:47px;line-height:1.07}.finish p{margin-top:20px;font-size:18px;color:#fff}.stamps{margin:21px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.stamps span{border:1px dashed #d7b4b9;border-radius:9px;background:#fff;padding:10px 7px;color:var(--black);font-size:14px;text-align:center}.cert{padding:26px 22px}.cert h2{font-size:27px;margin:10px 0}.cert p{font-size:17px;color:var(--muted)}.name-label{font:700 13px Georgia,serif;display:block;margin:15px 0 8px}.name-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:16px;background:white;color:var(--black);font-size:19px}.app-footer{padding:4px 21px 27px;font:12px Georgia,serif;color:var(--muted);text-align:center}.notice{font:13px/1.55 Georgia,serif;color:var(--muted);margin:18px 0 0}.bottom-action{position:sticky;bottom:0;z-index:10;background:linear-gradient(to bottom,rgba(242,237,236,.92),var(--ivory) 30%);padding:12px 0 max(12px,env(safe-area-inset-bottom));margin:20px -16px -94px;padding-inline:16px}.bottom-action .primary{box-shadow:0 10px 26px rgba(75,0,14,.18)}dialog{border:0;padding:0;border-radius:20px;width:calc(100% - 26px);max-width:520px;max-height:83dvh;background:#fff;box-shadow:0 20px 80px rgba(0,0,0,.3);color:var(--black)}dialog::backdrop{background:rgba(15,8,9,.66)}.dialogtop{position:sticky;top:0;background:var(--red);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;z-index:1}.dialogtop h2{font-size:25px}.close{background:transparent;border:1px solid #fff;border-radius:50%;width:39px;height:39px;color:#fff;font-size:25px;line-height:1}.dialog-body{padding:20px;overflow:auto;max-height:calc(83dvh - 72px)}.dialog-body .note{margin-bottom:13px}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:22px 0}@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(min-width:650px){body{background:#eae0de}.shell{box-shadow:0 0 75px rgba(55,19,28,.12)}.viewport{padding-left:24px;padding-right:24px}.bottom-action{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}@media print{body{background:white}.brandbar,.topline,.navrow,.bottom-action,.app-footer,.meta-strip,.mission-list,.section-head,.textbtn,.notice{display:none!important}.shell,.viewport{width:100%;max-width:none;background:#fff;box-shadow:none;padding:0}.panel{box-shadow:none;border:0}.finish{background:white;color:black}.finish p{color:black}.seal{border-color:#000}}

const MISSIONS=[{"country":"England · South Asia · Australia","name":"Cricket","subtitle":"The mystery of the flying ball","code":"01","symbol":"CR","opening":"Your Erasmus group is visiting a British school. At break time, some students invite you to watch a cricket match. You have never played before — but you can work out what is happening from their explanations.","clues":[["WHAT YOU SEE","One team is batting (trying to score runs by hitting the ball). A batter (the player holding the bat) protects a wicket (three wooden posts called stumps, with two small pieces called bails on top). A bowler (the player who delivers the ball) tries to hit the wicket. An umpire (the official who makes decisions) checks that the rules are followed."],["THE BIG SURPRISE","A powerful hit is not always worth the same number of runs (points). A ball that crosses the boundary (the outer edge of the playing area) after touching the ground scores four runs. If it flies over the boundary without touching the ground, it scores six."],["BEYOND THE UK","Cricket is loved in India, Pakistan, Australia and many other places. It spread partly through British colonial history, but people in these countries have made it an important part of their own cultures. The same sport connects communities across continents."]],"questions":[["Your host student says, “The bowler is getting ready.” What should you expect next?",["A player will deliver the ball towards the person with the bat.","A player will ask the umpire to calculate the score.","A player will replace the wooden posts behind the batter.","A player will carry the ball around the entire boundary."],0,"The bowler delivers the ball towards the batter, who tries to hit it and protect the wicket. The words bowler, batter and umpire describe different jobs — not different teams."],["A ball flies straight over the boundary without hitting the ground. Your group cheers. Why?",["The batting team has earned four runs.","The batting team has earned six runs.","The bowling team has won the match immediately.","The umpire has awarded an extra turn."],1,"That is a six: the ball crosses the boundary without bouncing first. A boundary hit after the ball touches the ground is usually worth four runs."],["A classmate points at three wooden posts. Which description is most accurate?",["They mark the starting line for the fielding team.","They show where spectators are allowed to stand.","They form part of the wicket the batter must protect.","They indicate where the umpire keeps the score."],2,"These posts are stumps. Two small wooden pieces called bails rest on top. A bowler can dismiss (get out) a batter by knocking the wicket over under the rules."],["An Indian exchange student tells you, “Cricket is part of our culture too.” Which response shows the best cultural understanding?",["“Then cricket must have been invented independently in India.”","“So the rules in India must be exactly like British school rules.”","“Cricket belongs only to countries where English is the first language.”","“A sport can travel through history and become meaningful in new communities.”"],3,"Exactly. Cricket spread through a complicated colonial history, but different countries have developed their own cricket heroes, competitions and traditions."],["You are making an Erasmus poster for pupils who know nothing about cricket. Which headline best captures your discovery?",["“A bat, a wicket and a surprising way to score.”","“A sport in which the ball must never touch the ground.”","“A game played only by professional athletes.”","“A competition where players never change roles.”"],0,"Cricket combines a bat, a wicket and several ways of scoring. Teams take turns batting and fielding (trying to stop runs and get batters out)."]]},{"country":"Scotland","name":"Highland Games","subtitle":"The log that must land straight","code":"02","symbol":"HG","opening":"Your Scottish host school takes the Erasmus group to a Highland Games festival. There are musicians, dancers and athletes. The strangest sight is a competitor lifting a whole tree trunk.","clues":[["NOT JUST A SPORTS DAY","The Highland Games celebrate Scottish culture with athletic competitions, Highland dancing, pipe bands (groups playing bagpipes) and community gatherings. Many people come for the music and atmosphere, not only the results."],["THE IMPOSSIBLE THROW","In the caber toss, an athlete lifts a caber (a long, heavy wooden log), runs a few steps and attempts to turn it over. The winner is not necessarily the person who throws it furthest. A good toss lands in a straight line, in the so-called twelve o’clock position."],["TRADITIONS THAT TRAVEL","Scottish migrants (people who moved to another country) brought the Highland Games to places including Canada and New Zealand. Today, these events connect local communities with their Scottish heritage (traditions and cultural history)."]],"questions":[["Two athletes compete: one throws the caber further, while the other makes it land almost perfectly straight. Who is more likely to impress the judges?",["The one who lifts the caber for the longest time.","The one whose caber lands closer to a straight line.","The one who takes the greatest number of running steps.","The one who makes the caber bounce after landing."],1,"In the caber toss, a straight landing matters more than distance. The ideal position is described as twelve o’clock — like a clock hand pointing directly ahead."],["You are creating a festival programme. Which combination reflects the activities described by your Scottish host?",["A caber toss, bagpipe music and Highland dancing.","A caber toss, fiddle music and a rowing competition.","Pipe bands, a hockey match and a ballroom dance.","Stone throwing, a swimming race and a folk concert."],0,"The Highland Games bring sport together with bagpipe music and dancing. That mixture is exactly why the festival is such a memorable introduction to Scottish culture."],["Your Canadian exchange partner says their town organises Highland Games. What is the most likely historical reason?",["Canadian teams won the first event in Scotland.","Canada has the same mountain ranges as Scotland.","Scottish migrants kept their traditions alive abroad.","All Commonwealth schools are required to hold them."],2,"Communities of Scottish origin have organised Highland Games far from Scotland. A tradition can survive migration and help people stay connected with their roots."],["An organiser tells you, “It is a celebration of heritage.” In this context, what does heritage mean?",["The number of medals an athlete has won.","The amount of money raised by the festival.","The equipment owned by a sports club.","Traditions and cultural history passed between generations."],3,"Heritage is what communities inherit and pass on — such as stories, music, language and customs. A festival can help younger people discover these traditions."],["You want to explain why Highland Games work well during Erasmus Days. Which argument is strongest?",["They show how sporting events can also share music, identity and local traditions.","They prove that sporting success is more important than cultural exchange.","They teach everyone to play the same sport with identical rules.","They are designed mainly for professional athletes."],0,"Sports festivals can be cultural meeting places. Visitors can connect with hosts through music, dance, conversation and shared experiences — even without taking part in a competition."]]},{"country":"Ireland","name":"Hurling","subtitle":"A fast game with an ancient story","code":"03","symbol":"HU","opening":"In Ireland, your host student takes you to a local sports club. You hear the crack of wooden sticks and see a small ball fly between tall posts. Then you discover the game is linked to Irish legends.","clues":[["WATCH THE GAME","Hurling is played with a hurley (a wooden stick with a wide, flat end) and a sliotar (a small, hard ball). Skilled players can move very quickly while balancing the ball on the hurley. A goal below the crossbar (the horizontal bar) scores three points; a shot above it, between the upright posts, scores one."],["OLDER THAN YOU THINK","Irish stories have mentioned forms of hurling for centuries. In 2018, UNESCO added it to its list of intangible cultural heritage (living traditions and skills worth protecting). This does not mean the game is a museum exhibit — it is still played in schools and clubs."],["A COMMUNITY SPORT","The GAA (Gaelic Athletic Association) supports Irish games through local clubs, often helped by volunteers (people who give their time without being paid). Joining a match can teach visitors about community life, not simply about scoring."]],"questions":[["You watch a player strike a sliotar above the crossbar, between the two tall posts. What should appear on the scoreboard?",["Three points for a goal.","Two points for a long-distance shot.","One point for a shot over the crossbar.","No points unless the ball touches the net."],2,"A shot above the crossbar scores one point. Getting the sliotar into the goal below it scores three. One set of posts offers two different scoring possibilities."],["Which description would help a new exchange student picture the equipment?",["A short paddle is used to send a rubber ball across a net.","A wooden stick is used to strike a small, hard ball.","A curved racket is used to hit a large leather ball.","A wooden club is used to push a soft ball along the ground."],1,"A hurley is a wooden stick and a sliotar is the small ball. You need these two terms to follow a match, but nobody expects a newcomer to know them in advance."],["UNESCO calls hurling “intangible cultural heritage”. What does that tell you?",["It is a living cultural tradition worth passing on.","It can only be played in protected historic buildings.","It is no longer played competitively today.","It has become compulsory in every European school."],0,"Intangible heritage is not a building or a statue. It includes living skills, practices and traditions shared by communities. Hurling was recognised by UNESCO in 2018."],["Your Irish host invites you to a GAA club run partly by volunteers. What can you reasonably expect to learn there?",["Only the names of famous international sponsors.","Only professional tactics used at the Olympics.","Mainly how to buy equipment from a sports shop.","How local people build friendships and support their community through sport."],3,"Volunteer-run sports clubs can be important meeting places. An Erasmus visit is a chance to see how a community organises itself and welcomes new people."],["You are writing a short travel blog. Which statement best connects hurling’s past and present?",["“Hurling is an ancient sport that disappeared hundreds of years ago.”","“A traditional game can remain important in modern schools and clubs.”","“UNESCO recognition means that the rules must never change.”","“Hurling became popular only after television was invented.”"],1,"Hurling is both historic and very much alive. Traditions do not have to remain unchanged or exist only in museums to be part of cultural heritage."]]},{"country":"Canada","name":"Lacrosse","subtitle":"More than a national sport","code":"04","symbol":"LA","opening":"Your Canadian exchange partner hands you a stick with a small net at the end. “This is lacrosse,” they say. “It is much older than you probably think.” The class is about to discover whose story it really is.","clues":[["THE EQUIPMENT","Lacrosse players use a stick with a netted pocket (the part that holds the ball). They catch, carry, pass and shoot the ball with it. The equipment might remind you of hockey, but the net changes how the game is played."],["WHO CREATED IT?","Indigenous peoples (the original peoples of a place) in North America played different traditional stick-ball games long before Europeans arrived. For some Indigenous communities, these games have spiritual significance (meaning connected with beliefs and ceremonies), not just a competitive purpose."],["A CANADIAN SURPRISE","Canadian law recognises lacrosse as the national summer sport and ice hockey as the national winter sport. The history of lacrosse is therefore a chance to learn about Indigenous cultures as well as modern Canada."]],"questions":[["A classmate asks why a lacrosse stick has a netted pocket. Which answer makes most sense?",["It helps the player catch, carry and release the ball.","It shows the referee which team should score next.","It protects the player from the weight of the ball.","It allows a player to kick the ball more accurately."],0,"The pocket lets players handle the ball with the stick. Watching how someone catches and releases it is a good way to understand lacrosse without memorising complicated rules."],["A visitor says, “Lacrosse was invented by European settlers.” What would be a better response?",["“Yes, because Canada was founded by Europeans.”","“No, it first developed as a modern school exercise.”","“Actually, Indigenous nations played related games long before European settlement.”","“No, it originated in Scotland and later travelled to Canada.”"],2,"Lacrosse has deep Indigenous roots. Different nations played their own forms of stick-ball games, and those traditions deserve recognition when we discuss the modern sport."],["A Canadian student says ice hockey is not their country’s official summer sport. Which fact supports them?",["Canada has no official national sports.","Lacrosse is the official summer sport; ice hockey is the winter sport.","Baseball is the official summer sport; lacrosse is the winter sport.","Lacrosse and ice hockey are both listed only as winter sports."],1,"Canada recognised both sports in law in 1994. Lacrosse is the summer sport and ice hockey the winter sport — a fact that surprises many visitors."],["Why should an Erasmus presentation about lacrosse include Indigenous perspectives?",["Because today’s international rules are identical everywhere.","Because every Indigenous nation has exactly the same traditions.","Because the game has no connection with modern Canada.","Because the sport’s origins and cultural meaning are part of its story."],3,"Sport has a history beyond the scoreboard. For some Indigenous communities, traditional games are linked with healing, beliefs and community relationships."],["Your group must choose the most respectful caption for a lacrosse exhibition. Which one works best?",["“A modern sport with deep roots in several Indigenous cultures.”","“An old game that lost all cultural meaning when it became popular.”","“A British sport that Indigenous communities learned to play later.”","“A sport with one original version shared by every Indigenous nation.”"],0,"Different Indigenous nations have their own histories and traditions. A respectful introduction avoids presenting Indigenous peoples as a single identical group."]]},{"country":"Aotearoa New Zealand","name":"Kī-o-rahi","subtitle":"A game that speaks a language","code":"05","symbol":"KĪ","opening":"Kia ora! Your Māori host student brings your exchange group to an unusual sports field. It is circular, and several parts have Māori names. Before you play, the group explains why language matters.","clues":[["A DIFFERENT FIELD","Kī-o-rahi is a traditional Māori ball game played on a circular field divided into areas. In many versions, a tupu (a target in the centre) and pou (markers around the outside) are important. The kī is the ball. Rules can vary between communities."],["WORDS THAT MATTER","Te reo Māori means the Māori language. You may also hear kia ora (a greeting meaning hello or thank you, depending on the situation) and Aotearoa (the Māori name for New Zealand). Using the correct words is one way to show interest in the local culture."],["LEARNING TOGETHER","A game does not always need one worldwide rulebook. Different communities can agree on how to play their local version. Visitors can ask questions, compare customs and learn to cooperate before competing."]],"questions":[["You arrive at a circular sports field with a central target. Which game from your host student’s explanation are you probably about to play?",["Cricket, because the field has a wicket in the centre.","Curling, because players aim at a painted circle.","Kī-o-rahi, which uses a circular playing area.","Lacrosse, because the goal is always placed in the middle."],2,"Kī-o-rahi has a distinctive circular layout. A central target called the tupu and outer markers called pou feature in many versions."],["Your host student says, “Pass me the kī.” What should you give them?",["The ball.","The central target.","The outer marker.","The team flag."],0,"The kī is the ball. Learning a few sport-specific Māori words makes it easier to take part and helps visitors appreciate te reo Māori."],["Two schools describe slightly different versions of Kī-o-rahi. What is the most reasonable explanation?",["One of the schools must be breaking international rules.","The sport can be played according to local community traditions.","The game must have been invented separately by both schools.","The rules change randomly whenever a new team arrives."],1,"Rules may vary between communities. Sharing and agreeing on rules can itself be part of cultural learning and cooperation."],["Your Māori host says “Kia ora!” as you arrive. What does this most likely mean?",["They are introducing the name of the ball.","They are asking you to start the match.","They are telling you where to stand.","They are greeting you in te reo Māori."],3,"Kia ora is a widely used Māori greeting. It is a simple example of how learning a local language can make an international exchange more meaningful."],["Which Erasmus activity best reflects what you have discovered about Kī-o-rahi?",["Let the visiting students replace local words with English equivalents.","Avoid asking questions because the sport is unfamiliar.","Ask local students to teach the rules and explain the meaning of key words.","Use only rules copied from a different country’s sports club."],2,"An exchange is not just about seeing another country. Visitors can listen to local knowledge, try new language and learn through shared activities."]]},{"country":"Scotland · Canada","name":"Curling","subtitle":"The chess match on ice","code":"06","symbol":"CU","opening":"Your exchange group steps into an ice rink (an indoor place where people practise ice sports). Heavy stones slide towards circles on the ice, while two players sweep madly in front of them. Is this a sport or a puzzle?","clues":[["THE TARGET","Curling teams slide heavy granite stones (stones made from a hard natural rock) towards the house (the circular target marked on the ice). The centre is called the button. Stones closer to the centre can score when an end (a round of play) is finished."],["WHY THE BRUSHES?","Sweeping (brushing the ice in front of a moving stone) can make the stone travel further and follow a straighter line. Teams must also think several moves ahead. That is why curling is sometimes called chess on ice."],["A SPORT THAT TRAVELLED","Curling developed in Scotland and spread to Canada with Scottish communities. Modern international competitions take place in carefully prepared indoor ice rinks, but people once played on frozen ponds and lakes."]],"questions":[["Your team’s stone is slowing down before it reaches the house. What might your teammates do?",["Ask the umpire to move the stone by hand.","Sweep the ice in front of the stone to help it travel further.","Place another stone directly behind it during the shot.","Turn off the lights to stop the ice from warming."],1,"Sweeping can reduce how quickly a stone slows and help it hold a straighter line. That is why teammates often shout instructions while the stone moves."],["Why might a player aim for a stone that is already near the centre, rather than an empty space?",["Because hitting any stone ends the match.","Because the house is only used at the start of play.","Because opponents must stay outside the house.","Because they may want to knock an opponent’s stone away."],3,"Curling is strategic. A team may aim at an opposing stone to remove it or change which stone is closest to the button."],["What does the nickname “chess on ice” suggest?",["Players need to plan ahead and respond to opponents.","Players must complete a chess game before entering the rink.","Players win by moving each stone into a different square.","Players are not allowed to speak during the match."],0,"Curling involves careful decisions, teamwork and tactics. Players think about the next shots, not just the one they are currently taking."],["Why does curling have strong traditions in both Scotland and Canada?",["Both countries invented modern curling independently.","It is compulsory in every Scottish and Canadian school.","Scottish communities helped spread the sport to Canada.","Curling can only be played in countries with frozen rivers."],2,"Scottish migrants helped curling spread across the world. Modern competitions mostly use indoor ice rinks, so naturally frozen lakes are no longer necessary."],["A beginner asks, “What is the button?” Which explanation is the most helpful?",["A switch that starts the scoreboard clock.","The small central part of the target on the ice.","A handle used to release the granite stone.","A mark showing where the players leave their brushes."],1,"The button is the centre of the house. Getting closer to it than the opposing stones is often the key to scoring."]]},{"country":"Wales","name":"Bog Snorkelling","subtitle":"The most unexpected race","code":"07","symbol":"BO","opening":"Welcome to Wales! Your exchange group has travelled to the small town of Llanwrtyd Wells. The locals invite you to watch a world championship — in a muddy ditch. You start to wonder whether they are joking.","clues":[["THE STRANGE COURSE","A bog is an area of very wet ground. Competitors race through a trench (a long, narrow channel) filled with dark bog water. They go along a 60-yard course and back, so the total distance is 120 yards (about 110 metres)."],["HOW TO MOVE","Competitors wear a snorkel (a tube used for breathing with your face in the water), a mask and often flippers (fins worn on the feet). Normal swimming strokes are not allowed. A small doggy-paddle movement is permitted, but the arms must stay below the water."],["AN INTERNATIONAL TRADITION","The World Bog Snorkelling Championships attract visitors from different countries, including the Czech Republic. Some competitors also wear fancy dress (funny costumes). A small Welsh town has turned an eccentric (unusual and slightly funny) local event into an international attraction."]],"questions":[["A competitor completes one 60-yard length and turns around. How far must they travel altogether?",["60 yards, because they have reached the turn.","90 yards, because the return route is shorter.","120 yards, because they swim there and back.","180 yards, because the trench must be crossed three times."],2,"The total course is two lengths of 60 yards: 120 yards, or roughly 110 metres. The competitor must touch the posts at the required ends of the trench."],["Your friend is a strong swimmer. Which advice is most useful before their first bog snorkelling race?",["“Practise moving with flippers, not ordinary swimming strokes.”","“Focus on breaststroke to save energy in the narrow trench.”","“You can stand up and run whenever the water gets muddy.”","“Use a front-crawl technique to get through the water quickly.”"],0,"Normal swimming strokes are not allowed. Competitors mainly use their legs and flippers; a limited doggy-paddle movement is permitted under the rules."],["A Czech visitor is surprised to see people from several countries competing in a Welsh bog. What does this tell you?",["International sport can exist only in large capital cities.","Local traditions become less important when visitors arrive.","Only people from Wales are interested in unusual sports.","Even a small community event can bring people from different countries together."],3,"The event has attracted competitors from the Czech Republic and several other countries. Unusual local traditions can become a reason for international encounters."],["You see a competitor wearing a colourful costume as well as a snorkel. Which explanation is most likely?",["Costumes are required because the water is extremely cold.","Fancy dress is part of the event’s playful atmosphere.","The costume shows that the competitor is an official referee.","A costume lets them avoid the normal race rules."],1,"Fancy dress is encouraged but not required. The event celebrates humour and creativity alongside athletic effort."],["Which Erasmus blog title would best represent your experience in Wales?",["“Why all local sports should follow Olympic rules.”","“The importance of winning every international competition.”","“Mud, laughter and a Welsh tradition that attracts the world.”","“How a Welsh swimming pool became a national stadium.”"],2,"Bog snorkelling shows how a small town can share its character with international visitors. Sometimes the most memorable cultural experiences are also the strangest."]]},{"country":"England · The Cotswolds","name":"Shin-kicking","subtitle":"A festival with unusual rules","code":"08","symbol":"SK","opening":"You have reached your final Erasmus destination: the Cotswolds in England. At a traditional festival, two competitors hold each other by the shoulders and try to kick each other’s shins. You are amazed that this is a real organised event.","clues":[["WHAT IS HAPPENING?","A shin is the front of your lower leg, between your knee and ankle. In shin-kicking, competitors try to make their opponent lose balance by kicking their shins. The competition is part of the Cotswold Olimpick Games, a festival whose traditions date back to 1612."],["STRANGE BUT REGULATED","Competitors wear long trousers and may put straw (dry plant stalks) inside them as padding (material used to soften an impact). Footwear with metal-reinforced toes is forbidden. Traditional does not mean there are no safety rules."],["THE BIGGER PICTURE","The Cotswold Olimpick Games are a local cultural event, not the modern Olympic Games. Visitors discover how a community can keep its distinctive traditions while changing rules to reduce injuries. Culture can be preserved and adapted."]],"questions":[["A visitor assumes that shin-kicking has no safety rules. Which fact would best challenge that idea?",["Competitors must stop after their first kick.","All competitors must wear the same protective helmet.","Every kick is checked using video technology.","Metal-toed footwear is banned and straw padding is allowed."],3,"The Cotswold Olimpick Games ban metal-reinforced footwear and allow straw as padding around the shins. Traditional games can change their rules to reduce injuries."],["You notice a competitor putting straw inside their trousers. What is the most likely reason?",["It provides padding to reduce the impact of kicks.","It makes the competitor taller than their opponent.","It helps the referee count the number of points.","It signals which village the competitor represents."],0,"Straw can be used as padding around the shins. Modern rules also require suitable footwear to make a very old sport somewhat safer."],["An organiser turns away an athlete wearing steel-toe boots (boots with metal protection around the toes). Why?",["Only competitors wearing traditional kilts may take part.","Footwear with metal-reinforced toes is not permitted for safety reasons.","The festival allows trainers only when it rains.","All competitors must be barefoot during matches."],1,"Metal-reinforced footwear is banned. Athletes may use trainers, shoes or soft-toed boots. This is a good example of a tradition adapting to modern safety expectations."],["The organiser mentions 1612. Which conclusion is best supported?",["The modern Olympic Games began in the Cotswolds that year.","The exact modern rules have been unchanged for over 400 years.","The festival has roots reaching back more than four centuries.","The first international shin-kicking championship took place that year."],2,"The Cotswold Olimpick Games trace their history to 1612. The event has changed over time, including safety measures, but it preserves a remarkable regional tradition."],["Your Erasmus group discusses whether traditional sports should ever change. What does shin-kicking illustrate?",["A tradition loses all value if it introduces safety measures.","The only purpose of a traditional sport is to win medals.","Unusual sports cannot be part of a community’s identity.","Communities can protect a tradition while adapting its rules."],3,"Keeping cultural heritage alive does not mean ignoring modern knowledge. The festival combines a distinctive old activity with clearer rules and safety precautions."]]}];
const LETTERS=['A','B','C','D'];
const STORAGE='sports-without-borders-mobile-v1';
const main=document.getElementById('app');
const notesDialog=document.getElementById('notesDialog');
function clean(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initial(){return {view:'home',active:0,unlocked:0,finished:[],pages:MISSIONS.map(()=>({stage:'notes',q:0,answers:[null,null,null,null,null]})),name:''};}
let state;
try{const found=JSON.parse(localStorage.getItem(STORAGE));state=found&&found.pages?.length===8&&Array.isArray(found.finished)&&found.pages.every(p=>Array.isArray(p.answers)&&p.answers.length===5)?found:initial();}catch(e){state=initial();}
state.unlocked=Math.min(7,Math.max(0,state.unlocked||0));state.active=Math.min(state.unlocked,Math.max(0,state.active||0));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function page(){return state.pages[state.active];}
function nDone(){return state.finished.length;}
function render(){document.getElementById('stampsCount').textContent=`${nDone()} / 8`;main.innerHTML=state.view==='home'?home():state.view==='finish'?finish():page().stage==='notes'?notes():page().stage==='quiz'?quiz():feedback();save();}
function header(label){const m=MISSIONS[state.active];return `<div class="topline"><button class="textbtn" data-action="home" aria-label="Back to passport">← My passport</button><span class="pill">MISSION ${m.code} / 08</span></div><div class="mission-heading"><div class="eyebrow">${clean(m.country)} · ${label}</div><h2>${clean(m.name)}</h2><p>${clean(m.subtitle)}</p></div>`;}
function home(){const current=state.active;return `<section class="hero"><div class="eyebrow">An Erasmus+ discovery adventure</div><h1>Sports<br>Without<br><em>Borders.</em></h1><p>Eight surprising sports. Eight cultural encounters. Explore the world, follow the clues and collect every passport stamp.</p></section><div class="meta-strip"><div class="meta"><b>8</b><small>Missions</small></div><div class="meta"><b>40</b><small>Questions</small></div><div class="meta"><b>${nDone()}</b><small>Stamps</small></div></div>${state.finished.length===8?`<button class="primary" data-action="finish">View your certificate →</button>`:`<button class="primary" data-action="start">${nDone()===0?'Begin your adventure':'Continue your adventure'} →</button>`}<div class="section-head"><h2>Your travel passport</h2><span>${nDone()} / 8 unlocked</span></div><div class="mission-list">${MISSIONS.map((m,i)=>{const done=state.finished.includes(i),locked=i>state.unlocked;return `<button class="mission-tile ${locked?'locked':i===current?'active':''}" ${locked?'disabled':''} data-mission="${i}" aria-label="Mission ${i+1}: ${clean(m.name)}, ${locked?'locked':done?'completed':'open'}"><span class="tile-number">${m.code}</span><span class="tile-content"><strong>${clean(m.name)}</strong><small>${clean(m.country)}</small></span><span class="tile-state">${done?'✓ Stamp':locked?'Locked':'Open →'}</span></button>`}).join('')}</div><p class="below">Read your host students’ field notes before answering. Every specialist term is explained in English, so you can learn as you travel.</p><button class="textbtn" data-action="reset">Start again / reset progress</button>`;}
function notes(){const m=MISSIONS[state.active],p=page();return `<div class="panel">${header('Discover')}<div class="panel-pad"><div class="eyebrow">An invitation from your host school</div><p class="intro">${clean(m.opening)}</p><h3 class="info-heading">Your field notes</h3><div class="note-stack">${m.clues.map(([t,body])=>`<article class="note"><h3>${clean(t)}</h3><p>${clean(body)}</p></article>`).join('')}</div><div class="hint"><b>Your task:</b> Use these facts to solve five challenges. You can reopen your notes at any time. You don't need to know the rules in advance.</div><div class="navrow"><button class="primary" data-action="quiz-start">${p.answers.some(a=>a!==null)?'Continue this mission':'Start this mission'} →</button></div></div></div>`;}
function quiz(){const m=MISSIONS[state.active],p=page(),q=m.questions[p.q],selected=p.answers[p.q];return `<div class="topline"><button class="textbtn" data-action="home">← My passport</button><span class="pill">${clean(m.name)}</span></div><section class="panel"><div class="panel-pad"><div class="minihead"><span class="eyebrow">Question ${p.q+1} of 5</span><button class="textbtn" data-action="show-notes">Field notes ↗</button></div><div class="progressline" role="progressbar" aria-label="Progress through mission questions" aria-valuenow="${p.q+1}" aria-valuemin="0" aria-valuemax="5"><span style="width:${(p.q+1)*20}%"></span></div><h2 class="qword">${clean(q[0])}</h2><div class="answers" role="group" aria-label="Choose one answer">${q[1].map((ans,i)=>`<button type="button" class="answer" data-answer="${i}" aria-pressed="${selected===i?'true':'false'}"><span class="key">${LETTERS[i]}</span><span class="answer-text">${clean(ans)}</span></button>`).join('')}</div><p class="question-instruction">Read carefully and choose the best answer. You can change your choice before checking your results.</p><div class="navrow"><button class="secondary" data-action="previous" ${p.q===0?'disabled':''}>← Back</button><button class="primary" id="nextQuestion" data-action="next" ${selected===null?'disabled':''}>${p.q===4?'See feedback →':'Continue →'}</button></div></div></section><p class="below">The explanations will appear after all five questions.</p>`;}
function feedback(){const m=MISSIONS[state.active],p=page(),points=m.questions.filter((q,i)=>p.answers[i]===q[2]).length,passed=points===5;return `<div class="topline"><button class="textbtn" data-action="home">← My passport</button><span class="pill">${clean(m.name)}</span></div><section class="panel"><div class="feedback-hero"><span class="eyebrow">Your mission discoveries</span><strong>${points}<small style="font-size:32px">/5</small></strong><h2>${passed?'Passport stamp earned!':'Every mistake teaches you something.'}</h2><p>${passed?'All five answers are correct. Explore what you have learnt before travelling on.':'Read each explanation carefully. The answers you got right will be saved for your next attempt.'}</p></div><div class="panel-pad"><div class="feedback-stack">${m.questions.map((q,i)=>{const correct=p.answers[i]===q[2];return `<article class="feedback-card ${correct?'':'is-wrong'}"><div class="feedback-label">${correct?'✓ Correct':'✕ Not quite'} · Question ${i+1}</div><h3>${clean(q[0])}</h3><p><b>You chose:</b> ${clean(q[1][p.answers[i]])}</p>${correct?'':`<p><b>Correct answer:</b> ${clean(q[1][q[2]])}</p>`}<p class="fact"><strong>Did you know?</strong> ${clean(q[3])}</p></article>`;}).join('')}</div><div class="result-end"><p>${passed?'Your next destination is ready.':'You can keep your correct answers and try only the ones you missed.'}</p><button class="primary" data-action="${passed?'collect':'retry'}">${passed?(state.active===7?'Finish your passport →':'Collect stamp & continue →'):'Try the missed questions →'}</button></div></div></section>`;}
function finish(){return `<section class="finish"><div class="eyebrow" style="color:#ffb6c4">All 8 destinations explored</div><div class="seal" aria-hidden="true">ERASMUS<br>EXPLORER</div><h1>Mission<br>Complete.</h1><p>You have explored eight sporting cultures and discovered that sport brings people, traditions and languages together.</p></section><div class="stamps">${MISSIONS.map(m=>`<span>✓ ${clean(m.name)}</span>`).join('')}</div><section class="panel"><div class="cert"><div class="eyebrow">Your cultural passport</div><h2>Sports Without Borders</h2><p>8 missions completed. 40 discoveries made.</p><label class="name-label" for="studentName">Your name (optional)</label><input class="name-input" id="studentName" maxlength="70" placeholder="Enter your name" value="${clean(state.name)}" autocomplete="off"><p class="notice">Curiosity opens doors. Every new cultural encounter is another chance to learn.</p><div class="navrow"><button class="primary" data-action="print">Print certificate</button></div><button class="textbtn" data-action="home">← Back to passport</button></div></section>`;}
function enter(i){if(i>state.unlocked)return;state.active=i;state.view='mission';render();goTop();}
function openNotes(){const m=MISSIONS[state.active];document.getElementById('modalTitle').textContent=`${m.name} · Field notes`;document.getElementById('modalContent').innerHTML=`<p>${clean(m.opening)}</p>${m.clues.map(([t,c])=>`<div class="note"><h3>${clean(t)}</h3><p>${clean(c)}</p></div>`).join('')}`;notesDialog.showModal();}
function changeAnswer(i){const p=page();p.answers[p.q]=i;for(const node of document.querySelectorAll('[data-answer]'))node.setAttribute('aria-pressed',String(Number(node.dataset.answer)===i));const next=document.getElementById('nextQuestion');if(next)next.disabled=false;save();}
function next(){const p=page();if(p.answers[p.q]===null)return;if(p.q<4){p.q++;}else if(p.answers.every(a=>a!==null)){p.stage='feedback';}else{p.q=p.answers.findIndex(a=>a===null);}render();goTop();}
function collect(){const i=state.active;if(!state.finished.includes(i))state.finished.push(i);if(state.finished.length===8){state.view='finish';}else{state.unlocked=Math.max(state.unlocked,i+1);state.active=i+1;state.view='mission';}render();goTop();}
function retry(){const p=page(),qs=MISSIONS[state.active].questions;let first=-1;qs.forEach((q,i)=>{if(p.answers[i]!==q[2]){p.answers[i]=null;if(first<0)first=i;}});p.q=first<0?0:first;p.stage='quiz';render();goTop();}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.answer!==undefined){changeAnswer(Number(b.dataset.answer));return;}if(b.dataset.mission!==undefined){enter(Number(b.dataset.mission));return;}switch(b.dataset.action){case'home':state.view='home';render();goTop();break;case'start':enter(Math.min(state.unlocked,state.finished.length));break;case'quiz-start':page().stage='quiz';render();goTop();break;case'show-notes':openNotes();break;case'previous':page().q=Math.max(0,page().q-1);render();goTop();break;case'next':next();break;case'collect':collect();break;case'retry':retry();break;case'finish':state.view='finish';render();goTop();break;case'print':window.print();break;case'reset':if(window.confirm('Delete your saved passport stamps and start again?')){state=initial();render();goTop();}break;}});
main.addEventListener('input',e=>{if(e.target.id==='studentName'){state.name=e.target.value;save();}});
document.getElementById('stampsCount').parentElement.addEventListener('click',()=>{state.view='home';render();goTop();});
document.getElementById('closeModal').addEventListener('click',()=>notesDialog.close());
notesDialog.addEventListener('click',e=>{if(e.target===notesDialog)notesDialog.close();});
render();
</script></body></html>
